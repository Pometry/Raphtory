name: Format code and generate schemas
permissions:
  contents: write
on:
  workflow_call:
jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        name: Checkout
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: 'false'
      # Only rustfmt is needed here: raphtory itself comes prebuilt from the Python tests (test_python_workflow.yml)
      - name: Setup nightly rust
        run: |
          rustup toolchain install nightly --allow-downgrade -c rustfmt
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.0"
          cache: 'pip'
      - name: Install Python dependencies
        run: |
          python -m pip install black mypy pandas-stubs
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Download raphtory wheel
        uses: actions/download-artifact@v4
        with:
          name: python-wheel-linux-py3.14
          # Outside the checkout, so the commit step below does not pick the wheel up
          path: ${{ runner.temp }}/wheel
      - name: Install raphtory
        run: |
          python -m pip install "$(ls ${{ runner.temp }}/wheel/*.whl)[all]"

      - name: Run rust format
        run: |
          cargo +nightly fmt --all

      - name: Run stubsgen
        run: |
          python -m pip install -e stub_gen
          cd python/scripts && python gen-stubs.py

      - name: Update graphQL schema
        run: |
          raphtory schema > raphtory-graphql/schema.graphql
      - name: Validate graphQL schema
        run: |
          npx graphql-schema-linter --rules fields-have-descriptions,types-have-descriptions raphtory-graphql/schema.graphql || true
      - name: Update docs from graphQL schema
        run: |
          python docs/scripts/gen_docs_graphql_pages.py

      - name: Run python linter
        run: |
          cd python && black .

      # The installed wheel ships the stubs from before stubsgen ran, so copy the fresh ones over it.
      # mypy must check raphtory as an installed package (as the old editable install did); checking
      # the source tree directly also reports errors in submodule stubs that it otherwise silences.
      - name: Run mypy
        run: |
          site=$(python -c 'import os, raphtory; print(os.path.dirname(raphtory.__file__))')
          (cd python/python/raphtory && find . -name '*.pyi' -exec cp --parents {} "$site" \;)
          mypy -m raphtory

      - name: Check for uncommitted changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected. Committing and pushing..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore: apply tidy-public auto-fixes"
            git push https://oauth2:$GITHUB_TOKEN@github.com/Pometry/Raphtory.git HEAD:${{ github.head_ref }} 
          else
            echo "No changes to commit."
          fi