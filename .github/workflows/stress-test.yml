name: Rust Benchmarks

permissions:
  contents: read

on:
  workflow_call:

jobs:
  stress-test:
    name: GraphQL Stress Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Checkout
      - uses: ./.github/actions/setup_rust
        name: Setup Rust
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          # Only base branches save caches: PR-scoped caches are unreadable by other PRs and evict the useful ones
          save-if: ${{ github.ref == 'refs/heads/db_v4' || github.ref == 'refs/heads/master' || github.head_ref == 'pygraph_dfload_and_vacuum' }}  # TODO: remove head_ref clause before merge (cache test)
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 9
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: "1.0.0"
      - name: Run stress test
        env:
          RUST_BACKTRACE: 1
        run: |
          cargo build --package raphtory-server --bin raphtory-server --profile=build-fast
          ./target/build-fast/raphtory-server server --work-dir graphs &
          cd graphql-bench
          make stress-test
      - name: Upload k6 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-report
          path: graphql-bench/stress-test-report.html
