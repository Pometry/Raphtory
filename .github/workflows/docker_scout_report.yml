name: Docker Scout daily report
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install Docker Scout
        run: curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh | sh

      - name: Scan published images
        run: |
          for tag in latest latest-python; do
            docker scout quickview "pometry/raphtory:$tag" | sed "/^What's next/,\$d"
          done | tee report.txt

      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          jq -Rs '{text: ("*Docker Scout daily report*\n```" + . + "```")}' report.txt |
            curl -fsS -H 'content-type: application/json' -d @- "$SLACK_WEBHOOK_URL"
