name: Rust Benchmarks
permissions:
  # submit PR comment
  pull-requests: write
  # deployments permission to deploy GitHub pages website
  deployments: write
  # contents permission to update benchmark contents in gh-pages branch
  contents: write
on:
  workflow_call:

jobs:
  benchmark:
    name: GraphQL Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Checkout
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
      - name: Install maturin
        run: pip install maturin==1.9.4
      - name: Build raphtory
        run: |
          make install-minimal-python
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 9
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: "1.0.0"
      - name: Run GraphQL benchmarks
        run: cd graphql-bench && make bench-local
      # Failure only, so green runs stay quiet. `make bench-local` runs the server and k6 under
      # `concurrently --kill-others`, so a server that died (or was still building its bench graph
      # when k6's setup() tried to connect) shows up only in these logs.
      - name: Print bench diagnostics
        if: failure()
        run: |
          cd graphql-bench || exit 0
          echo "::group::output.json"
          cat output.json || echo "(no output.json was produced)"
          echo "::endgroup::"
          echo "::group::raphtory server log (last 300 lines)"
          tail -n 300 server.log || echo "(no server.log)"
          echo "::endgroup::"
          echo "::group::k6 log (last 300 lines)"
          tail -n 300 k6.log || echo "(no k6.log)"
          echo "::endgroup::"
          echo "::group::k6 csv output"
          ls -la output.csv.gz || echo "(no output.csv.gz)"
          echo "rows: $(gzip -dc output.csv.gz 2>/dev/null | wc -l || echo unknown)"
          echo "--- header + first rows ---"
          { gzip -dc output.csv.gz 2>/dev/null || true; } | head -n 5 || true
          echo "::endgroup::"
      - name: Upload bench diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: graphql-bench-diagnostics
          path: |
            graphql-bench/output.json
            graphql-bench/output.csv.gz
            graphql-bench/build.log
            graphql-bench/server.log
            graphql-bench/k6.log
          if-no-files-found: warn
          retention-days: 7
      - name: Restore modified files
        run: |
          git restore Cargo.lock # modified by build; github-action-benchmark can't switch to gh-pages with dirty working tree
          git restore graphql-bench/data/apache/master # otherwise github-action-benchmark fails to create the commit
      - name: Print bench results
        run: cat graphql-bench/output.json
      - name: Store benchmark results from master branch
        if: github.ref == 'refs/heads/master'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: GraphQL Benchmark
          tool: "customBiggerIsBetter"
          output-file-path: graphql-bench/output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: "200%"
          comment-on-alert: true
          summary-always: true
          fail-on-alert: false
          auto-push: true
          benchmark-data-dir-path: dev/bench-graphql
      - name: Compare benchmark results to master
        if: github.ref != 'refs/heads/master'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: GraphQL Benchmark
          tool: "customBiggerIsBetter"
          output-file-path: graphql-bench/output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: "200%"
          comment-on-alert: true
          summary-always: true
          fail-on-alert: false
          save-data-file: false
          benchmark-data-dir-path: dev/bench-graphql
