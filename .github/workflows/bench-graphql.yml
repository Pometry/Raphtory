name: Rust Benchmarks
permissions:
  # submit PR comment
  pull-requests: write
  # deployments permission to deploy GitHub pages website
  deployments: write
  # contents permission to update benchmark contents in gh-pages branch
  contents: write
on:
  workflow_call:

jobs:
  benchmark:
    name: GraphQL Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Checkout
      - uses: ./.github/actions/setup_rust
        name: Setup Rust
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-release-minimal
      - name: Install maturin
        run: pip install maturin==1.9.4
      - name: Build raphtory
        run: |
          make install-minimal-python
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 9
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: "1.0.0"
      # A crashing server leaves nothing but "Segmentation fault" in server.log, so have the kernel
      # write a core we can collect below. The runner's default pattern pipes cores to apport.
      - name: Enable core dumps
        run: |
          sudo mkdir -p /tmp/cores && sudo chmod 1777 /tmp/cores
          sudo sysctl -w kernel.core_pattern=/tmp/cores/core.%e.%p.%t
      - name: Run GraphQL benchmarks
        run: |
          ulimit -c unlimited
          cd graphql-bench
          # memory over time, so a crash under memory pressure can be told from one that is not
          bash mem-sampler.sh 5 > mem.log 2>&1 &
          trap 'kill %1 2>/dev/null' EXIT
          make bench-local
      # Failure only, so green runs stay quiet. `make bench-local` runs the server and k6 under
      # `concurrently --kill-others`, so a server that died (or was still building its bench graph
      # when k6's setup() tried to connect) shows up only in these logs.
      - name: Print bench diagnostics
        if: failure()
        run: |
          cd graphql-bench || exit 0
          echo "::group::output.json"
          cat output.json || echo "(no output.json was produced)"
          echo "::endgroup::"
          echo "::group::raphtory server log (last 300 lines)"
          tail -n 300 server.log || echo "(no server.log)"
          echo "::endgroup::"
          # An OOM kill is SIGKILL ("Killed", exit 137) and leaves "Out of memory: Killed process";
          # a segfault leaves "segfault at <addr> ip <pc> sp <sp> error <n> in <lib>".
          echo "::group::kernel log (oom / segfault)"
          sudo dmesg -T | grep -i -E 'out of memory|oom|killed process|segfault|general protection|traps:' \
            || echo "(nothing relevant in dmesg)"
          echo "::endgroup::"
          echo "::group::memory over time (last 60 samples, 5s apart)"
          tail -n 60 mem.log || echo "(no mem.log)"
          echo "::endgroup::"
          echo "::group::k6 log (last 300 lines)"
          # gzipped as it is written; a long run's log is far too big to keep uncompressed
          gzip -dc k6.log.gz 2>/dev/null | tail -n 300 || echo "(no k6.log.gz)"
          echo "::endgroup::"
          echo "::group::k6 csv output"
          ls -la output.csv.gz || echo "(no output.csv.gz)"
          echo "rows: $(gzip -dc output.csv.gz 2>/dev/null | wc -l || echo unknown)"
          echo "--- header + first rows ---"
          { gzip -dc output.csv.gz 2>/dev/null || true; } | head -n 5 || true
          echo "::endgroup::"
      # Prints every thread's backtrace and bundles core + mapped libraries; see collect-core.sh
      # for how to open the bundle elsewhere.
      - name: Collect core dumps
        if: failure()
        run: |
          echo "::group::core dumps"
          bash graphql-bench/collect-core.sh /tmp/cores graphql-bench/crash
          echo "::endgroup::"
      - name: Upload core dumps
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: graphql-bench-core
          path: graphql-bench/crash/
          if-no-files-found: ignore
          retention-days: 7
          # already zstd-compressed
          compression-level: 0
      - name: Upload bench diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: graphql-bench-diagnostics
          path: |
            graphql-bench/output.json
            graphql-bench/output.csv.gz
            graphql-bench/build.log
            graphql-bench/server.log
            graphql-bench/k6.log.gz
            graphql-bench/mem.log
          if-no-files-found: warn
          retention-days: 7
      # github-action-benchmark below has to `git switch gh-pages`, which aborts if any tracked
      # file is dirty. The bench dirties several: Cargo.lock from the build, pnpm-lock.yaml from
      # `pnpm install --no-frozen-lockfile`, and graphql-bench/data/apache/master from the server
      # writing to the graph it serves. Restoring them path by path meant each newly dirtied file
      # broke the run, so reset the whole tree instead. This only touches tracked files, so the
      # bench outputs the later steps read (output.json above all) are left alone.
      - name: Restore modified files
        run: |
          git reset --hard
          echo "worktree after reset (empty means clean):"
          git status --porcelain
      - name: Print bench results
        run: cat graphql-bench/output.json
      - name: Store benchmark results from master branch
        if: github.ref == 'refs/heads/master'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: GraphQL Benchmark
          tool: "customBiggerIsBetter"
          output-file-path: graphql-bench/output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: "200%"
          comment-on-alert: true
          summary-always: true
          fail-on-alert: false
          auto-push: true
          benchmark-data-dir-path: dev/bench-graphql
      - name: Compare benchmark results to master
        if: github.ref != 'refs/heads/master'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: GraphQL Benchmark
          tool: "customBiggerIsBetter"
          output-file-path: graphql-bench/output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: "200%"
          comment-on-alert: true
          summary-always: true
          fail-on-alert: false
          save-data-file: false
          benchmark-data-dir-path: dev/bench-graphql
