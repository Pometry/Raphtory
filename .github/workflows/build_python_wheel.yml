name: Build Linux Python wheel
permissions:
  contents: read
on:
  workflow_call:
jobs:
  build-wheel:
    name: Build Linux wheel (default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Checkout
        with:
          # Must match the ref format.yml checks out, so the stubs and schema it generates describe the code it commits to
          ref: ${{ github.head_ref }}
          persist-credentials: 'false'
      - uses: ./.github/actions/setup_rust
        name: Setup Rust
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        name: Cargo cache
        with:
          # Jobs building the same profile/features/RUSTFLAGS share one cache per OS
          shared-key: python-build-fast
          # Restore only: the Python test job sharing this key builds more and saves the fuller cache
          save-if: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.0"
          cache: 'pip'
      # Default features (datafusion, vectors) and no `test` feature, so the stubs and schema generated from it cover the full public API
      - name: Build raphtory wheel
        working-directory: python
        run: |
          python -m pip install "maturin>=1.9.4"
          maturin build --profile build-fast --interpreter python --out dist
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-linux
          path: python/dist/*.whl
          if-no-files-found: error
          retention-days: 1
