name: Run Rust test
permissions: {}
on:
  workflow_call:
    inputs:
      skip_tests:
        type: boolean
        default: false
        required: false
# DO NOT CHANGE NAME OF WORKFLOW, USED IN OTHER WORKFLOWS KEEP "Rust Tests"
jobs:
  rust-test-no-storage:
    if: ${{ !inputs.skip_tests }}
    name: Rust Tests
    runs-on: "${{ matrix.os }}"
    env:
      RUST_BACKTRACE: 1
      CARGO_BUILD_JOBS: 3
    strategy:
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup_rust
        name: Setup Rust
      - name: Free up space (ubuntu)
        if: "contains(matrix.os, 'ubuntu')"
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rust version
        run: rustc --version --verbose
      - uses: Swatinem/rust-cache@v2
        name: Cargo cache
        with:
          # Jobs building the same profile/features/RUSTFLAGS share one cache per OS
          shared-key: rust-tests
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run all Tests (no disk_graph)
        env:
          RUSTFLAGS: -Awarnings
          TEMPDIR: ${{ runner.temp }}
        run: |
          cargo nextest run --workspace --exclude raphtory_netflow --all-features --cargo-profile build-fast
  feature-check:
    if: ${{ !inputs.skip_tests }}
    name: "Check all features"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup_rust
        name: Setup Rust
      - name: Free up space (ubuntu)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        name: Cargo cache
        with:
          # Jobs building the same profile/features/RUSTFLAGS share one cache per OS
          shared-key: rust-check
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      - name: Check all features
        env:
          RUSTFLAGS: -Awarnings
        run: |
          cargo hack check --workspace --exclude raphtory_netflow --all-targets --each-feature
  doc-test:
    if: ${{ !inputs.skip_tests }}
    name: "Doc tests"
    runs-on: "${{ matrix.os }}"
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup_rust
        name: Setup Rust
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        name: Cargo cache
        with:
          # Jobs building the same profile/features/RUSTFLAGS share one cache per OS
          shared-key: rust-check
          # Restore only: this job finishes first and would save a thin cache before the heavier job sharing the key
          save-if: false
      - name: Build Rust Docs
        uses: actions-rs/cargo@v1
        env:
          RUSTFLAGS: -Awarnings
        with:
          command: doc
          args: --no-deps -p raphtory -q
