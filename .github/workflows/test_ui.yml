name: Run UI tests
permissions:
  contents: read
on:
  workflow_call:
jobs:
  select-strategy:
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ steps.set-matrix.outputs.python-versions }}
    steps:
      - id: set-matrix
        run: |
          echo "python-versions=[\"3.11\",\"3.14.0\"]" >> $GITHUB_OUTPUT
  build-wheel:
    name: Build UI wheel (${{ matrix.python }})
    needs: select-strategy
    strategy:
      matrix:
        python: ${{ fromJson(needs.select-strategy.outputs.python-versions) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        name: Checkout
      - uses: ./.github/actions/setup_rust
        name: Setup Rust
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        name: Cargo cache
        with:
          cache-all-crates: true
          # pyo3 artifacts differ per interpreter, so keep one cache per Python version
          key: py${{ matrix.python }}
          # Only base branches save caches: PR-scoped caches are unreadable by other PRs and evict the useful ones
          save-if: ${{ github.ref == 'refs/heads/db_v4' || github.ref == 'refs/heads/master' || github.head_ref == 'pygraph_dfload_and_vacuum' }}  # TODO: remove head_ref clause before merge (cache test)
      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # The UI does not need datafusion or vectors, so skip them to cut build time
      - name: Build raphtory wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: build
          args: --release --no-default-features --interpreter python --out dist
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: ui-wheel-py-${{ matrix.python }}
          path: python/dist/*.whl
          if-no-files-found: error
          retention-days: 1
  ui-test:
    name: UI Tests
    needs: [ select-strategy, build-wheel ]
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJson(needs.select-strategy.outputs.python-versions) }}
        browser: [ chromium, firefox ]
        shard: [ 1, 2, 3 ]
    runs-on: windows-latest
    env:
      NUM_SHARDS: 3
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        name: Checkout
      - name: Install Server-Media-Foundation (firefox needs it on Windows Server)
        if: matrix.browser == 'firefox'
        shell: pwsh
        run: Install-WindowsFeature Server-Media-Foundation
      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"
      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: ui-wheel-py-${{ matrix.python }}
          path: wheel
      - name: Install raphtory wheel into venv
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install wheel/*.whl
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install ui-tests npm deps
        working-directory: ui-tests
        run: npm install
      - name: Resolve playwright cache dir
        id: pw-cache-dir
        run: |
          case "$RUNNER_OS" in
              Windows) echo "dir=$LOCALAPPDATA/ms-playwright" >> "$GITHUB_OUTPUT" ;;
              macOS)   echo "dir=$HOME/Library/Caches/ms-playwright" >> "$GITHUB_OUTPUT" ;;
              *)       echo "dir=$HOME/.cache/ms-playwright" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Cache playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pw-cache-dir.outputs.dir }}
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('ui-tests/package-lock.json') }}
      - name: Install playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        working-directory: ui-tests
        run: npx playwright install ${{ matrix.browser }}
      - name: Test UI
        timeout-minutes: 30
        # Run raphtory on a non-default port so a UI bundle that hardcoded
        # http://localhost:1736 cannot self-mask: any test needing GraphQL
        # data would fail immediately when the GraphQL POST hits a dead origin.
        env:
          RAPHTORY_PORT: '1737'
        run: |
          # On Windows the venv activate script lives under Scripts/ rather than bin/.
          source .venv/Scripts/activate
          python ui-tests/test_server.py &
          # Wait until the picker's exact GraphQL query reports the vanilla
          # namespace at the root, then require three consecutive successes so
          # the server is stable before we let the browser hit it (raphtory on
          # Windows can return transient empty results during background discovery).
          query='{"query":"{ namespace(path: \"\") { items { page(limit: 5, pageIndex: 0) { __typename ... on Namespace { path } ... on MetaGraph { path } } count } } }"}'
          streak=0
          for i in $(seq 1 120); do
              body=$(curl -s -m 5 -H 'Content-Type: application/json' \
                  -d "$query" "http://localhost:$RAPHTORY_PORT/" || true)
              if echo "$body" | grep -q '"path":"vanilla"'; then
                  streak=$((streak + 1))
                  echo "Picker query OK ($streak/3)"
                  if [ "$streak" = "3" ]; then
                      break
                  fi
              else
                  streak=0
              fi
              if [ "$i" = "120" ]; then
                  echo "Timed out waiting for raphtory picker to be stable"
                  echo "Last response: $body"
                  exit 1
              fi
              sleep 2
          done
          # Extra settle time for any background indexing
          sleep 10
          cd ui-tests
          UI_BASE_URL="http://localhost:$RAPHTORY_PORT" GRAPHQL_URL="http://localhost:$RAPHTORY_PORT" npx playwright test --project ${{ matrix.browser }} --shard=${{ matrix.shard }}/${{ env.NUM_SHARDS }}
      - name: Upload UI Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}-py-${{ matrix.python }}-shard-${{ matrix.shard }}
          path: ui-tests/playwright-report
          retention-days: 7
