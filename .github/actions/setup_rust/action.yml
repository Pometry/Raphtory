name: "setup_rust"
description: "Setup rust based on version in Cargo.toml"

runs:
  using: "composite"
  steps:
    - name: Get minimum rust version
      id: rust-version
      shell: bash
      run: |
        version=$(cargo metadata --no-deps --quiet --format-version=1 | python -c "import json, sys; print(json.load(sys.stdin)['packages'][0]['rust_version'])")
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Minimum required rust version is $version"
    - name: Setup rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.rust-version.outputs.version }}
        components: cargo,clippy,rust-docs,rust-src,rust-std,rustc,rustfmt
    # Pin every cargo/rustc call in the job to the Cargo.toml version, while leaving other
    # toolchains (the runner's stable, nightly for fmt) installed. `cargo +nightly ...`
    # still takes precedence over RUSTUP_TOOLCHAIN.
    - name: Pin rust version
      shell: bash
      run: |
        version="${{ steps.rust-version.outputs.version }}"
        echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
        echo "RUST_VERSION=$version" >> "$GITHUB_ENV"
        RUSTUP_TOOLCHAIN="$version" rustc --version
