[package]
name = "raphtory"
description = "raphtory, a temporal graph library"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
keywords.workspace = true
authors.workspace = true
documentation.workspace = true
categories.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
homepage.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
raphtory-api.workspace = true
raphtory-core.workspace = true
raphtory-storage.workspace = true
raphtory-itertools.workspace = true
storage.workspace = true
db4-graph.workspace = true
iter-enum = { workspace = true, features = ["rayon"] }
hashbrown = { workspace = true }
chrono = { workspace = true }
crossbeam-channel = { workspace = true }
itertools = { workspace = true }
num-traits = { workspace = true }
num-integer = { workspace = true }
parking_lot = { workspace = true }
once_cell = { workspace = true }
quick_cache = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
rustc-hash = { workspace = true }
bigdecimal = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
serde = { workspace = true }
thiserror = { workspace = true }
dashmap = { workspace = true }
ordered-float = { workspace = true }
glam = { workspace = true }
quad-rand = { workspace = true }
serde_json = { workspace = true }
ouroboros = { workspace = true }
either = { workspace = true }
bytemuck = { workspace = true }
tracing = { workspace = true }
ahash = { workspace = true }
roaring = { workspace = true }
strsim = { workspace = true }
walkdir = { workspace = true }
parquet = { workspace = true }
arrow-json = { workspace = true }
arrow-csv = { workspace = true }
arrow = { workspace = true, features = ["chrono-tz"] }
arrow-array.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
serde_arrow.workspace = true
datafusion-physical-expr-common = { workspace = true, optional = true }
datafusion-physical-expr = { workspace = true, optional = true }
datafusion-physical-plan = { workspace = true, optional = true }
datafusion-expr-common = { workspace = true, optional = true }

# io optional dependencies
csv = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
bzip2 = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["blocking"], optional = true }
tokio = { workspace = true, optional = true }
kdam = { workspace = true, optional = true }

# vectors optional dependencies
futures-util = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
async-openai = { workspace = true, optional = true }
minijinja = { workspace = true, optional = true }
minijinja-contrib = { workspace = true, optional = true }
heed = { workspace = true, optional = true }
moka = { workspace = true, optional = true, features = ["future"] }
lancedb = { workspace = true, optional = true }
axum = { workspace = true, optional = true }

# python binding optional dependencies
pyo3 = { workspace = true, optional = true }
numpy = { workspace = true, optional = true }
num = { workspace = true, optional = true }
display-error-chain = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
pyo3-arrow = { workspace = true, optional = true }
pythonize = { workspace = true, optional = true }


[dev-dependencies]
csv = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true } # for vector testing
dotenvy = { workspace = true } # for vector testing
streaming-stats = { workspace = true }
indoc = { workspace = true }
proptest.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
tikv-jemallocator.workspace = true

[features]
default = ["datafusion"]

# enables progress bars
progress = ["dep:kdam"]

# Enables the graph loader io module
io = [
    "dep:bzip2",
    "dep:flate2",
    "dep:csv",
    "dep:reqwest",
    "dep:tokio",
    "dep:tempfile",
    "dep:zip",
    "dep:kdam",
]

# datafusion-backed node-state sort/group_by ops (enabled by default)
datafusion = [
    "dep:datafusion-physical-expr-common",
    "dep:datafusion-physical-expr",
    "dep:datafusion-physical-plan",
    "dep:datafusion-expr-common",
]

# vectors
vectors = [
    "dep:futures-util",
    "dep:async-trait",
    "dep:async-openai",
    "dep:minijinja",
    "dep:minijinja-contrib",
    "raphtory-api/template",
    "dep:heed",
    "dep:moka",
    "dep:lancedb",
    "dep:tokio", # also used for the io feature
    "dep:tempfile", # also used for the storage feature
    "dep:axum"
]

# Enables generating the pyo3 python bindings
python = [
    "io",
    "progress",
    "dep:pyo3",
    "dep:numpy",
    "dep:num",
    "dep:display-error-chain",
    "dep:pyo3-arrow",
    "dep:pythonize",
    "raphtory-api/python",
    "raphtory-core/python",
    "kdam/notebook",
]

panic-on-drop = [
    "storage/panic-on-drop"
]
