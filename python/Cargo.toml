[package]
name = "raphtory-pymodule"
description = "Python package for raphtory, a temporal graph library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
keywords.workspace = true
authors.workspace = true
documentation.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
homepage.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_raphtory"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { workspace = true }
raphtory = { workspace = true, features = [
    "python",
] }
raphtory-graphql = { workspace = true, features = [
    "python",
] }
auth = { workspace = true }


[features]
default = ["datafusion", "vectors"]
# maturin auto-enables this feature by name; without it pyo3 links libpython
# into the extension and `import raphtory` segfaults on static-python setups.
extension-module = ["pyo3/extension-module"]
datafusion = ["raphtory/datafusion"]
# search = ["raphtory/search", "raphtory-graphql/search"]
vectors = ["raphtory/vectors", "raphtory-graphql/vectors"]
test = ["raphtory/panic-on-drop", "extension-module"]


[build-dependencies]
pyo3-build-config = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
tikv-jemallocator.workspace = true
