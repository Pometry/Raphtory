[package]
name = "raphtory-pymodule"
description = "Python package for raphtory, a temporal graph library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
keywords.workspace = true
authors.workspace = true
documentation.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
homepage.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_raphtory"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { workspace = true }
raphtory = { workspace = true, features = [
    "python",
] }
raphtory-graphql = { workspace = true, features = [
    "python",
] }
auth = { workspace = true }


[features]
default = ["datafusion", "vectors", "rdf", "shacl"]
datafusion = ["raphtory/datafusion"]
# RDF import/export and SPARQL queries (GraphView.sparql / to_rdf, Graph.load_rdf / retract_rdf,
# and the `sparql` field of the GraphQL server)
rdf = ["raphtory/rdf", "raphtory-graphql/rdf"]
# SHACL validation of graph views (GraphView.validate_shacl / validate_shacl_at). It also turns
# on RDF 1.2 and SPARQL 1.2 syntax for the whole module.
shacl = ["rdf", "raphtory/shacl"]
# search = ["raphtory/search", "raphtory-graphql/search"]
vectors = ["raphtory/vectors", "raphtory-graphql/vectors"]
test = ["raphtory/panic-on-drop"]


[build-dependencies]
pyo3-build-config = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
tikv-jemallocator.workspace = true
