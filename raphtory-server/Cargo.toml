[package]
name = "raphtory-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "raphtory-server"
path = "src/main.rs"

[dependencies]
raphtory-graphql = { workspace = true }
auth = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[features]
vectors = ["raphtory-graphql/vectors"]
# the `rdfGraph` field and the `/sparql` endpoint; off by default, like `vectors`
rdf = ["raphtory-graphql/rdf"]
# `RdfGraph.validateShacl`
shacl = ["rdf", "raphtory-graphql/shacl"]
