[package]
name = "raphtory-benchmark"
publish = false
version.workspace = true
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
criterion = { workspace = true }
raphtory = { workspace = true, features = [
    "io",
] }
raphtory-api = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
rayon = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
fake = { workspace = true }
csv = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }

[[bin]]
name = "vectorise"
path = "bin/vectorise.rs"

[[bench]]
name = "tgraph_benchmarks"
harness = false

[[bench]]
name = "base"
harness = false

[[bench]]
name = "parameterized"
harness = false

[[bench]]
name = "graph_ops"
harness = false

[[bench]]
name = "algobench_fast"
harness = false

[[bench]]
name = "algobench_medium"
harness = false

[[bench]]
name = "algobench_slow"
harness = false

[[bench]]
name = "edge_add"
harness = false

[[bench]]
name = "materialise"
harness = false

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "vectors"
harness = false
required-features = ["vectors"]

[[bench]]
name = "temporal_props"
harness = false

[features]
vectors = ["raphtory/vectors"]
