[package]
name = "raphtory-vectors"
description = "Vector embeddings, document templates and similarity search for Raphtory graphs"
version.workspace = true
documentation.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
homepage.workspace = true
keywords.workspace = true
authors.workspace = true
rust-version.workspace = true
edition.workspace = true

[dependencies]
# everything is behind the `vectors` feature, so that building the workspace without it
# doesn't compile lancedb (and the arrow/datafusion versions it pins)
raphtory = { workspace = true, features = ["vectors"], optional = true }
raphtory-api = { workspace = true, features = ["template"], optional = true }
raphtory-core = { workspace = true, optional = true }
raphtory-storage = { workspace = true, optional = true }
ahash = { workspace = true, optional = true }
async-openai = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
either = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
heed = { workspace = true, optional = true }
itertools = { workspace = true, optional = true }
lancedb = { workspace = true, optional = true }
minijinja = { workspace = true, optional = true }
minijinja-contrib = { workspace = true, optional = true }
moka = { workspace = true, features = ["future"], optional = true }
parking_lot = { workspace = true, optional = true }
roaring = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

# python binding optional dependencies
pyo3 = { workspace = true, optional = true }
pyo3-arrow = { workspace = true, optional = true }
arrow-array = { workspace = true, optional = true }
arrow-buffer = { workspace = true, optional = true }

[dev-dependencies]
dotenvy.workspace = true
indoc.workspace = true
once_cell.workspace = true
rand.workspace = true
raphtory = { workspace = true, features = ["io"] }

[features]
vectors = [
    "dep:raphtory",
    "dep:raphtory-api",
    "dep:raphtory-core",
    "dep:raphtory-storage",
    "dep:ahash",
    "dep:async-openai",
    "dep:async-trait",
    "dep:axum",
    "dep:bytemuck",
    "dep:bytes",
    "dep:either",
    "dep:futures-util",
    "dep:heed",
    "dep:itertools",
    "dep:lancedb",
    "dep:minijinja",
    "dep:minijinja-contrib",
    "dep:moka",
    "dep:parking_lot",
    "dep:roaring",
    "dep:serde",
    "dep:serde_json",
    "dep:tempfile",
    "dep:thiserror",
    "dep:tokio",
    "dep:tracing",
]
python = [
    "vectors",
    "dep:pyo3",
    "dep:pyo3-arrow",
    "dep:arrow-array",
    "dep:arrow-buffer",
    "raphtory/python",
    "raphtory-api/python",
]
panic-on-drop = ["raphtory?/panic-on-drop"]

[[test]]
name = "test_vectors"
required-features = ["vectors"]
