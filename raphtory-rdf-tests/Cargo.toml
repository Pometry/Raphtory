# W3C conformance tests for raphtory-rdf (separate crate so the W3C suites stay out of raphtory-rdf).
# The feature is off by default, so workspace builds skip the tests.

[package]
name = "raphtory-rdf-tests"
version.workspace = true
documentation.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
homepage.workspace = true
keywords.workspace = true
authors.workspace = true
rust-version.workspace = true
edition.workspace = true
categories.workspace = true
publish = false

[dependencies]
raphtory = { workspace = true, features = ["panic-on-drop"] }
raphtory-rdf = { workspace = true, optional = true }
oxigraph = { workspace = true, optional = true }
spargebra = { workspace = true, optional = true }
rustc-hash = { workspace = true, optional = true }
rudof_rdf = { workspace = true, optional = true }

[dev-dependencies]
url = { workspace = true }

[features]
rdf = [
    "dep:raphtory-rdf",
    "dep:oxigraph",
    "dep:spargebra",
    "dep:rudof_rdf",
    "dep:rustc-hash",
]

# The W3C SPARQL and Turtle test suites (test-suites/rdf-tests).
[[test]]
name = "sparql_w3c"
required-features = ["rdf"]

# The W3C SHACL test suite (test-suites/data-shapes).
[[test]]
name = "shacl_w3c"
required-features = ["rdf"]
